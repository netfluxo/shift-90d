name: Deploy to Cloudflare Workers

# Trunk-based: deploya ao dar merge/push na main. Também roda sob demanda.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Evita deploys concorrentes pisando um no outro.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Cloudflare binding types
        # cloudflare-env.d.ts é gerado (gitignored). Sem ele o type-check do build
        # não conhece PHOTOS_BUCKET/DB e falha.
        run: npm run cf:typegen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build (OpenNext)
        run: npm run cf:build
        env:
          # Valor público, inlinado pelo Next no build (não é secret).
          # Mantido em sync com o `vars` do wrangler.jsonc.
          NEXT_PUBLIC_R2_PUBLIC_URL: https://pub-1aed824bdf3a40d3a22f6042d9a75d2b.r2.dev

      - name: Deploy (wrangler)
        # `wrangler deploy` direto (não `opennextjs-cloudflare deploy`) para pular a
        # etapa de populate remote R2 cache, que exige escopo R2 no token além do
        # Workers:Edit. O cache incremental é populado em runtime sob demanda.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
